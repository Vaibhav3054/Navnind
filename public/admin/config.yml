backend:
  name: github
  repo: Vaibhav3054/Navnind # IMPORTANT: Change this to your actual GitHub repo!
  branch: main # Or master depending on your default branch
  use_pkce: true # Enables login without needing a server

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog" # Where the markdown files will be saved
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Body", name: "body", widget: "markdown"}
